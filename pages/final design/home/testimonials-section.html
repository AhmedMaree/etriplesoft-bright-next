<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testimonials section</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f9fe; --ink:#0f1535; --muted:#5a6079; --brand:#3b3bf5; --brand-soft:#e9ebff;
  --blue:#1e90ff; --violet:#8b7cf6; --green:#22c79a; --star:#f5b400;
  --radius:24px; --gap:22px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink)}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.testimonials{position:relative;overflow:hidden;max-width:1500px;margin:0 auto;padding:40px 48px 56px}

/* decoration: big quote marks + dots (behind content) */
.deco{position:absolute;top:10px;right:130px;z-index:0;pointer-events:none;display:flex;gap:40px;align-items:flex-start}
.deco .q{font:700 340px/0.8 Georgia,serif;color:#e7edfb;height:230px;overflow:hidden}
.deco .dots{width:70px;height:130px;margin-right:-20px;
  background-image:radial-gradient(circle,#c9d3ee 2px,transparent 2.4px);background-size:24px 26px}

.head{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.eyebrow{display:flex;align-items:center;gap:16px;font-size:14px;font-weight:600;letter-spacing:.16em;color:var(--brand)}
.eyebrow::after{content:"";width:74px;height:1px;background:var(--brand);opacity:.6}
h2{font-size:clamp(34px,3.6vw,52px);line-height:1.15;font-weight:700;letter-spacing:-.03em;margin:14px 0 14px}
h2 span{color:var(--brand)}
.sub{font-size:19px;line-height:1.6;color:var(--muted);max-width:28em}
.nav{display:flex;gap:14px;padding-bottom:20px}
.nav button{width:60px;height:60px;border-radius:50%;border:1px solid #dfe4f3;background:#fff;color:var(--ink);
  display:grid;place-items:center;font-size:22px;cursor:pointer;box-shadow:0 8px 20px rgba(40,50,120,.08)}
.nav button.next{background:var(--brand);border-color:var(--brand);color:#fff}
.nav button:disabled{opacity:.45;cursor:default}
.nav button:focus-visible{outline:2px solid var(--brand);outline-offset:3px}

/* ---------- slider ---------- */
.track{position:relative;z-index:1;display:flex;gap:var(--gap);margin-top:24px;padding:6px 4px 26px;
  overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 calc((100% - 2*var(--gap))/3);scroll-snap-align:start;background:#fff;border-radius:var(--radius);
  border-left:4px solid var(--c);box-shadow:0 14px 40px rgba(50,60,140,.08);
  padding:32px 34px 28px 40px;display:flex;flex-direction:column;gap:26px;min-height:344px}
.card.blue{--c:var(--blue)} .card.violet{--c:var(--violet)} .card.green{--c:var(--green)}
.quote{position:relative;padding-left:72px;font-size:19px;line-height:1.65;color:#3a4160;flex:1}
.quote::before{content:"\201C";position:absolute;left:0;top:-14px;font:700 92px/1 Georgia,serif;color:var(--c);opacity:.35}
.foot{display:flex;align-items:center;gap:14px}
.avatar{width:62px;height:62px;border-radius:50%;flex:none;background:#c8d1ea center/cover;
  display:grid;place-items:center;font-weight:700;color:#fff;font-size:20px}
.who{flex:1;min-width:0}
.who b{display:block;font-size:17px;font-weight:600}
.who small{display:block;font-size:15px;color:var(--muted);margin-top:2px}
.stars{color:var(--star);letter-spacing:3px;font-size:17px;margin-top:6px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.06em;font-size:20px;white-space:nowrap;color:var(--ink)}
.logo svg{width:38px;height:38px}
.logo small{display:block;font-size:10px;letter-spacing:.3em;font-weight:600}

/* ---------- dots ---------- */
.dots-nav{position:relative;z-index:1;display:flex;justify-content:center;gap:10px;margin-top:10px}
.dots-nav button{width:14px;height:10px;border-radius:999px;border:0;background:#dde2f5;cursor:pointer;transition:width .25s,background .25s}
.dots-nav button[aria-current="true"]{width:48px;background:var(--brand)}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .testimonials{padding:28px 20px 44px}
  .card{flex-basis:calc((100% - var(--gap))/2)}
  .deco{display:none}
}
@media (max-width:700px){
  .head{flex-direction:column;align-items:flex-start}
  .card{flex-basis:100%;padding:26px 24px 24px 28px}
  .quote{padding-left:54px;font-size:17px}
  .foot{flex-wrap:wrap}
  .logo{margin-left:76px}
}
@media (prefers-reduced-motion:reduce){.track{scroll-behavior:auto}}
</style>
</head>
<body>

<section class="testimonials" aria-labelledby="t-title">
  <div class="deco" aria-hidden="true"><span class="dots"></span><span class="q">”</span></div>

  <div class="head">
    <div>
      <p class="eyebrow">CLIENT EXPERIENCES</p>
      <h2 id="t-title">Trusted by Businesses<br>Across <span>Industries</span></h2>
      <p class="sub">Hear from clients who have partnered with ETripleSoft and achieved real results.</p>
    </div>
    <div class="nav">
      <button class="prev" aria-label="Previous testimonials"><svg class="i"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="next" aria-label="Next testimonials"><svg class="i"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>

  <div class="track" tabindex="0" aria-label="Client testimonials">
    <!-- Card 1 -->
    <figure class="card blue">
      <blockquote class="quote">Their Odoo solution streamlined our operations and gave us full visibility across finance, inventory and sales. The team was professional and always supportive.</blockquote>
      <figcaption class="foot">
        <div class="avatar" style="background-image:url(images/people/ahmed.jpg);background-color:#3a5a8c">AM</div>
        <div class="who"><b>Ahmed Mostafa</b><small>CEO, Manufacturing Company</small><div class="stars" aria-label="5 stars">★★★★★</div></div>
        <div class="logo" style="color:#10267a">
          <svg viewBox="0 0 40 40"><path d="M4 36L20 4l16 32h-7L20 18l-9 18z" fill="#1d3fbf"/></svg>
          <span>ALPHA<small>INDUSTRIES</small></span>
        </div>
      </figcaption>
    </figure>

    <!-- Card 2 -->
    <figure class="card violet">
      <blockquote class="quote">We’ve improved our efficiency and reduced manual work significantly with ETripleSoft’s automation and integration solutions. Their team truly understands our industry.</blockquote>
      <figcaption class="foot">
        <div class="avatar" style="background-image:url(images/people/karim.jpg);background-color:#5a4a8c">KD</div>
        <div class="who"><b>Karim El Desouky</b><small>Operations Manager, Retail Group</small><div class="stars" aria-label="5 stars">★★★★★</div></div>
        <div class="logo" style="color:#10267a">
          <svg viewBox="0 0 40 40" fill="none" stroke="#10267a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h5l4 18h18l4-13H10"/><circle cx="14" cy="32" r="2.4"/><circle cx="28" cy="32" r="2.4"/></svg>
          <span>RITAILO<small>GROUP</small></span>
        </div>
      </figcaption>
    </figure>

    <!-- Card 3 -->
    <figure class="card green">
      <blockquote class="quote">The ETripleSoft team delivered a custom web and mobile solution that exceeded our expectations. Their support and expertise made the whole process smooth and successful.</blockquote>
      <figcaption class="foot">
        <div class="avatar" style="background-image:url(images/people/tamer.jpg);background-color:#6a5a4a">TG</div>
        <div class="who"><b>Tamer Galal</b><small>IT Director, Education Sector</small><div class="stars" aria-label="5 stars">★★★★★</div></div>
        <div class="logo" style="color:#0a2540">
          <svg viewBox="0 0 40 40" fill="#14b08a"><path d="M3 9c6-2 12-1 17 3v22C15 30 9 29 3 31zM37 9c-6-2-12-1-17 3v22c5-4 11-5 17-3z"/></svg>
          <span>EDUCARE<small>ACADEMY</small></span>
        </div>
      </figcaption>
    </figure>
  </div>

  <div class="dots-nav" role="tablist" aria-label="Testimonial pages"></div>
</section>

<script>
(() => {
  const root = document.querySelector(".testimonials");
  const track = root.querySelector(".track");
  const prev = root.querySelector(".prev");
  const next = root.querySelector(".next");
  const dotsBox = root.querySelector(".dots-nav");
  const cards = [...track.children];

  const perView = () => Math.round(track.clientWidth / cards[0].getBoundingClientRect().width) || 1;
  const step = () => cards[0].getBoundingClientRect().width + parseFloat(getComputedStyle(track).columnGap || 22);
  const pages = () => Math.max(1, cards.length - perView() + 1);
  const index = () => Math.round(track.scrollLeft / step());

  function buildDots() {
    dotsBox.innerHTML = "";
    for (let i = 0; i < pages(); i++) {
      const b = document.createElement("button");
      b.setAttribute("aria-label", `Go to testimonial ${i + 1}`);
      b.onclick = () => track.scrollTo({ left: i * step() });
      dotsBox.appendChild(b);
    }
    update();
  }
  function update() {
    const i = Math.min(index(), pages() - 1);
    [...dotsBox.children].forEach((d, n) => d.setAttribute("aria-current", n === i));
    const single = pages() === 1;
    prev.disabled = single || i === 0;
    next.disabled = single || i === pages() - 1;
    dotsBox.style.display = single ? "none" : "";
  }
  prev.onclick = () => track.scrollBy({ left: -step() });
  next.onclick = () => track.scrollBy({ left: step() });
  track.addEventListener("scroll", () => requestAnimationFrame(update), { passive: true });
  addEventListener("resize", buildDots);
  buildDots();
})();
</script>
</body>
</html>
